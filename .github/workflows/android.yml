name: Android

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --console=plain --stacktrace > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^e: " gradle-test.log | head -12 | while IFS= read -r line; do echo "::error title=compile::$line"; done
            grep -E "What went wrong|Caused by:|Execution failed for task" -A2 gradle-test.log | head -20 | while IFS= read -r line; do echo "::error title=gradle::$line"; done
          fi
          exit "$status"

      - name: Assemble debug APK
        if: success()
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riyad-as-salihin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
