name: Launch smoke test

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/**"]

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Install image helper
        run: pip install --quiet pillow

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Launch app on emulator and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set +e
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.riyadsalihin.amharic/.MainActivity
            sleep 30
            adb exec-out screencap -p > shot.png
            python3 -c "from PIL import Image; im=Image.open('shot.png'); im.thumbnail((420,1200)); im.convert('RGB').save('shot.jpg','JPEG',quality=74,optimize=True)"
            adb logcat -d -b crash > crash.txt
            adb logcat -d > full.txt
            PID=$(adb shell pidof com.riyadsalihin.amharic | tr -d '\r')
            echo "app pid: [$PID]"
            if [ -z "$PID" ]; then
              echo "::error title=Launch::app process is not running after launch"
              exit 1
            fi
            if grep -q "FATAL EXCEPTION" crash.txt; then
              echo "::error title=Launch::app crashed on startup"
              exit 1
            fi
            echo "launch OK"

      - name: Publish crash details
        if: always()
        run: |
          if [ -s crash.txt ]; then
            MSG=$(tr '\n' '~' < crash.txt | head -c 6000)
            echo "::error title=Crash buffer::$MSG"
          else
            echo "::notice title=Crash buffer::empty - no startup crash"
          fi
          if [ -s shot.jpg ]; then
            B64=$(base64 -w0 shot.jpg)
            echo "::warning title=Screenshot $(stat -c%s shot.jpg) bytes::$B64"
          fi
